# nginx config for the production image (see Dockerfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths (e.g. /journey/<id>) are served by Angular's router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles can be cached for a long time
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }
}
