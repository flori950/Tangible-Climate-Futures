<mat-expansion-panel [expanded]="triggerExpandSubject | async" (afterCollapse)="afterCollapse()">
  <mat-expansion-panel-header [class.selected]="isSelected$ | async" [style.background]="color">
    <div class="header">
      <!-- Only stops clicks on the checkbox/buttons from toggling the expansion panel. -->
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <div class="header-title" (click)="$event.stopImmediatePropagation()">
        <mat-checkbox
          [checked]="isAllSelected$ | async"
          [indeterminate]="isOneSelected$ | async"
          (change)="selectCollectionFiles($event)"
          ><div>
            {{ collection.title }}
          </div></mat-checkbox
        >
        <div class="edit-button">
          <button mat-icon-button (click)="editTitle()">
            <mat-icon fontIcon="edit"></mat-icon>
          </button>
        </div>
        <div class="edit-button">
          <button mat-icon-button (click)="deleteCollection()">
            <mat-icon fontIcon="delete"></mat-icon>
          </button>
        </div>
      </div>
      <button
        mat-button
        [disabled]="isSelected$ | async"
        (click)="selectCollection(); $event.stopPropagation()"
      >
        {{ 'collection.show-filters' | translate }}
        <mat-icon
          [fontIcon]="(isSelected$ | async) === true ? 'visibility' : 'visibility_off'"
        ></mat-icon>
      </button>
    </div>
  </mat-expansion-panel-header>
  <div>
    @for (file of dataFiles.results; track file) {
      <app-data-file-list-entry [file]="file"></app-data-file-list-entry>
    }
    @if (dataFiles.results.length === 0) {
      <div class="no-data">
        {{ 'collection.no-data' | translate }}
      </div>
    }
  </div>
</mat-expansion-panel>
