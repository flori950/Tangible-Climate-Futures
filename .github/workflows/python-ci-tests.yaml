name: Python-CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "backend/data-science/**"

jobs:
  DataScience:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/data-science

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/data-science/requirements.txt
            backend/data-science/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term
