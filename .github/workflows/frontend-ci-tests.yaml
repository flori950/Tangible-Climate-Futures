name: Frontend-CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "common/**"

jobs:
  Frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest, jsdom)
        run: npm run test:ci

      - name: Production build
        run: npm run build
