name: Backend-CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "backend/public-api/**"
      - "common/**"

jobs:
  PublicApi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/public-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/public-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck (incl. tests)
        run: npm run typecheck

      - name: Tests
        run: npm test

  EndToEnd:
    runs-on: ubuntu-latest
    needs: PublicApi

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/public-api/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/data-science/requirements.txt

      - name: Install data-science service
        run: pip install -r backend/data-science/requirements.txt

      - name: Install public API
        run: npm ci
        working-directory: backend/public-api

      - name: Local end-to-end scenarios (real MongoDB, real Python service)
        run: npm run test:e2e
        working-directory: backend/public-api
        env:
          DATASCIENCE_PYTHON: python
